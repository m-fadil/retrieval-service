# Reusable check suite. Called by ci.yml (PRs, branch pushes) and by release.yml
# as a `needs` dependency of its publish job.
name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Matches the runtime image. node 24+ bundles undici 7, incompatible
        # with the undici 6 dispatcher API @qdrant/js-client-rest pins; pinned
        # to 22 until qdrant-js supports undici 7. A 24 entry would pass
        # regardless, since the unit tests mock Qdrant.
        node: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Separate steps so a failed run identifies which one broke.
      - name: Typecheck
        run: npm run build
      - name: Test
        run: npm test

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --omit=dev: the runtime image ships production deps only, so a dev-only
      # advisory is not an exposure and must not block a release.
      - run: npm audit --omit=dev --audit-level=high

  # In verify.yml rather than ci.yml so release.yml runs it too: publish is
  # gated on the image booting.
  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # load: true, no push — release.yml owns publishing. amd64 only: the smoke
      # test runs the image on the runner. Writes the gha cache that
      # release.yml's multi-arch build reads within the same run.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: retrieval-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Covers container boot and config.ts validation of a full environment.
      # Credentials are fake by design: /health is the only unauthenticated
      # route and its sole dependency is Qdrant, expected to be unreachable.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e QDRANT_URL=http://qdrant.invalid:6333 \
            -e FRAPPE_URL=http://frappe.invalid:8000 \
            -e FRAPPE_AUTH_TOKEN='token ci:ci' \
            -e RETRIEVAL_API_KEY=ci-smoke-key \
            -e OPENAI_API_URL=https://llm.invalid \
            -e OPENAI_API_KEY=sk-ci \
            -e OPENAI_MODEL=ci-model \
            -e EMBEDDING_API_URL=https://embed.invalid \
            -e EMBEDDING_API_KEY=ci-embed \
            -e EMBEDDING_MODEL=ci-embed-model \
            retrieval-service:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then
              echo "health ok after ${i}s"
              curl -fsS http://127.0.0.1:3000/health
              break
            fi
            if [ "$i" = 30 ]; then
              echo "service did not become healthy" >&2
              docker logs smoke >&2
              exit 1
            fi
            sleep 1
          done

          # Re-checks the auth guard against the built image; test/security.test.ts
          # covers it in-process only.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"question":"hi"}' \
            http://127.0.0.1:3000/chat)
          if [ "$status" != "401" ]; then
            echo "expected 401 from unauthenticated /chat, got $status" >&2
            docker logs smoke >&2
            exit 1
          fi
          echo "unauthenticated /chat correctly rejected"

          # Graceful shutdown: exit on SIGTERM must precede docker stop's 10s
          # SIGKILL timeout.
          start=$(date +%s)
          docker stop smoke >/dev/null
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          if [ "$elapsed" -ge 10 ]; then
            echo "container ignored SIGTERM and was killed" >&2
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: docker logs smoke || true
