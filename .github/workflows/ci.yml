name: CI

on:
  pull_request:
    branches: [master, develop]
  # release.yml triggers on tags only; branch pushes are verified here.
  push:
    branches: [master, develop]

# cancel-in-progress on pull_request events only: branch pushes each keep a
# terminal status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  # Aggregate status check for branch protection: fixed name, independent of
  # verify.yml's job list and matrix dimensions.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "verify: ${{ needs.verify.result }}"
          [ "${{ needs.verify.result }}" = "success" ]
